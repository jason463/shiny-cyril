<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Real-Time Raytracer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0a0f;
    color: #e0e0e0;
    font-family: 'Courier New', monospace;
    overflow: hidden;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  #header {
    text-align: center;
    margin-bottom: 16px;
    z-index: 10;
  }

  #header h1 {
    font-size: 22px;
    font-weight: 400;
    letter-spacing: 4px;
    color: #b0b0c0;
    text-transform: uppercase;
  }

  #header p {
    font-size: 11px;
    color: #606070;
    margin-top: 4px;
  }

  #canvas-wrap {
    position: relative;
    border: 1px solid #1a1a2e;
    box-shadow: 0 0 40px rgba(80, 80, 160, 0.15);
  }

  canvas {
    display: block;
    cursor: grab;
    image-rendering: pixelated;
  }

  canvas:active { cursor: grabbing; }

  #stats {
    position: absolute;
    top: 8px;
    left: 8px;
    background: rgba(0, 0, 0, 0.7);
    padding: 8px 12px;
    font-size: 11px;
    line-height: 1.6;
    border-radius: 4px;
    border: 1px solid #1a1a2e;
    pointer-events: none;
  }

  #controls {
    position: absolute;
    bottom: 8px;
    right: 8px;
    background: rgba(0, 0, 0, 0.7);
    padding: 8px 12px;
    font-size: 10px;
    line-height: 1.6;
    border-radius: 4px;
    border: 1px solid #1a1a2e;
    pointer-events: none;
    color: #808090;
  }

  #scene-controls {
    margin-top: 12px;
    display: flex;
    gap: 8px;
    justify-content: center;
    z-index: 10;
  }

  button {
    background: #1a1a2e;
    color: #b0b0c0;
    border: 1px solid #2a2a4e;
    padding: 6px 16px;
    font-family: 'Courier New', monospace;
    font-size: 11px;
    cursor: pointer;
    border-radius: 3px;
    transition: all 0.2s;
    letter-spacing: 1px;
  }

  button:hover { background: #2a2a4e; border-color: #4a4a6e; }
  button.active { background: #3a3a5e; border-color: #6a6abe; color: #fff; }

  #quality-label {
    font-size: 10px;
    color: #606070;
    margin-top: 6px;
    text-align: center;
  }
</style>
</head>
<body>

<div id="header">
  <h1>Realtime Raytracer</h1>
  <p>Pure JavaScript &mdash; zero dependencies &mdash; written from scratch by Claude</p>
</div>

<div id="canvas-wrap">
  <canvas id="canvas"></canvas>
  <div id="stats">
    <div>FPS: <span id="fps">--</span></div>
    <div>Rays: <span id="rays">--</span></div>
    <div>Spheres: <span id="sphere-count">--</span></div>
    <div>Bounces: <span id="bounces">--</span></div>
  </div>
  <div id="controls">
    Drag: orbit &bull; Scroll: zoom &bull; Space: pause
  </div>
</div>

<div id="scene-controls">
  <button id="btn-scene-1" class="active" onclick="setScene(0)">Crystal</button>
  <button id="btn-scene-2" onclick="setScene(1)">Solar</button>
  <button id="btn-scene-3" onclick="setScene(2)">Bounce</button>
  <button id="btn-reflections" onclick="toggleReflections()">Reflections: ON</button>
  <button id="btn-shadows" onclick="toggleShadows()">Shadows: ON</button>
</div>
<div id="quality-label">Resolution scale: drag to interact, release for full quality</div>

<script>
// ============================================================
//  VECTOR MATH
// ============================================================
const vec3 = (x, y, z) => ({ x, y, z });
const add = (a, b) => vec3(a.x + b.x, a.y + b.y, a.z + b.z);
const sub = (a, b) => vec3(a.x - b.x, a.y - b.y, a.z - b.z);
const mul = (a, s) => vec3(a.x * s, a.y * s, a.z * s);
const dot = (a, b) => a.x * b.x + a.y * b.y + a.z * b.z;
const len = (a) => Math.sqrt(dot(a, a));
const norm = (a) => { const l = len(a); return l > 0 ? mul(a, 1 / l) : vec3(0, 0, 0); };
const reflect = (i, n) => sub(i, mul(n, 2 * dot(i, n)));
const lerp3 = (a, b, t) => vec3(a.x + (b.x - a.x) * t, a.y + (b.y - a.y) * t, a.z + (b.z - a.z) * t);
const clamp01 = (v) => Math.max(0, Math.min(1, v));

// ============================================================
//  CANVAS SETUP
// ============================================================
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const BASE_W = 480, BASE_H = 360;
let scale = 0.5;       // render at half res during interaction
let fullScale = 1.0;   // full res when idle
let currentScale = scale;
canvas.width = BASE_W;
canvas.height = BASE_H;
canvas.style.width = BASE_W + 'px';
canvas.style.height = BASE_H + 'px';

// ============================================================
//  CAMERA
// ============================================================
let camTheta = 0.6;
let camPhi = 0.4;
let camDist = 12;
let camTarget = vec3(0, 1, 0);

function getCameraRay(u, v) {
  const eye = vec3(
    camDist * Math.sin(camTheta) * Math.cos(camPhi),
    camDist * Math.sin(camPhi) + 1,
    camDist * Math.cos(camTheta) * Math.cos(camPhi)
  );
  const forward = norm(sub(camTarget, eye));
  const right = norm(vec3(-forward.z, 0, forward.x));
  const up = norm({
    x: right.y * forward.z - right.z * forward.y,
    y: right.z * forward.x - right.x * forward.z,
    z: right.x * forward.y - right.y * forward.x
  });
  const fov = 1.2;
  const dir = norm(add(add(forward, mul(right, u * fov)), mul(up, v * fov)));
  return { origin: eye, dir };
}

// ============================================================
//  SCENE OBJECTS
// ============================================================
let spheres = [];
let lights = [];
let enableReflections = true;
let enableShadows = true;
const MAX_BOUNCES = 4;

function makeSphere(center, radius, color, reflectivity = 0, emissive = null) {
  return { center, radius, color, reflectivity, emissive: emissive || vec3(0, 0, 0) };
}

// --- Scene Definitions ---
function scenePresets(time) {
  return [
    // 0: Crystal arrangement
    () => {
      spheres = [
        makeSphere(vec3(0, -200, 0), 199.5, vec3(0.25, 0.28, 0.35), 0.3),  // ground
        makeSphere(vec3(0, 1.2, 0), 1.2, vec3(0.95, 0.95, 1.0), 0.85),      // center mirror
        makeSphere(vec3(-2.5, 0.7, -1), 0.7, vec3(0.9, 0.2, 0.2), 0.4),
        makeSphere(vec3(2.5, 0.7, -1), 0.7, vec3(0.2, 0.2, 0.9), 0.4),
        makeSphere(vec3(-1.2, 0.5, 2.2), 0.5, vec3(0.2, 0.85, 0.3), 0.3),
        makeSphere(vec3(1.2, 0.5, 2.2), 0.5, vec3(0.9, 0.8, 0.1), 0.3),
        // floating orbs
        makeSphere(vec3(Math.sin(time * 0.7) * 3, 3 + Math.sin(time * 1.1) * 0.5, Math.cos(time * 0.7) * 3), 0.35, vec3(1, 1, 1), 0.1, vec3(2, 2, 2)),
        makeSphere(vec3(Math.sin(time * 0.7 + 2.1) * 3, 3.5 + Math.sin(time * 1.3) * 0.4, Math.cos(time * 0.7 + 2.1) * 3), 0.25, vec3(1, 0.8, 0.6), 0.0, vec3(1.5, 1.2, 0.8)),
      ];
      lights = [
        { pos: vec3(5, 8, 5), color: vec3(1, 0.95, 0.9), intensity: 1.0 },
        { pos: vec3(-4, 6, -3), color: vec3(0.6, 0.7, 1.0), intensity: 0.5 },
      ];
    },
    // 1: Solar system
    () => {
      spheres = [
        makeSphere(vec3(0, -200, 0), 199.5, vec3(0.15, 0.12, 0.2), 0.15),
        // sun
        makeSphere(vec3(0, 2.5, 0), 1.5, vec3(1, 0.9, 0.5), 0.0, vec3(3, 2.5, 1.5)),
      ];
      // orbiting planets
      const planets = [
        { dist: 3.5, speed: 1.0, r: 0.35, col: vec3(0.3, 0.5, 0.9), refl: 0.2, yOff: 0 },
        { dist: 5.0, speed: 0.6, r: 0.55, col: vec3(0.85, 0.5, 0.2), refl: 0.1, yOff: 0.3 },
        { dist: 6.8, speed: 0.35, r: 0.45, col: vec3(0.2, 0.8, 0.4), refl: 0.3, yOff: -0.2 },
        { dist: 8.5, speed: 0.2, r: 0.6, col: vec3(0.7, 0.3, 0.6), refl: 0.5, yOff: 0.1 },
      ];
      for (const p of planets) {
        const angle = time * p.speed;
        spheres.push(makeSphere(
          vec3(Math.sin(angle) * p.dist, 1 + p.r + p.yOff + Math.sin(time * 0.5 + p.dist) * 0.3, Math.cos(angle) * p.dist),
          p.r, p.col, p.refl
        ));
      }
      lights = [
        { pos: vec3(0, 2.5, 0), color: vec3(1, 0.9, 0.7), intensity: 1.5 },
        { pos: vec3(0, 10, 0), color: vec3(0.3, 0.3, 0.5), intensity: 0.2 },
      ];
    },
    // 2: Bouncing balls
    () => {
      spheres = [
        makeSphere(vec3(0, -200, 0), 199.5, vec3(0.35, 0.35, 0.4), 0.5),  // mirror floor
      ];
      const N = 12;
      for (let i = 0; i < N; i++) {
        const angle = (i / N) * Math.PI * 2;
        const dist = 3 + Math.sin(i * 1.7) * 1;
        const bouncePhase = time * 2.5 + i * 0.5;
        const y = Math.abs(Math.sin(bouncePhase)) * 3;
        const r = 0.35 + Math.sin(i * 2.3) * 0.15;
        const hue = i / N;
        // HSL-ish to RGB
        const cr = clamp01(Math.abs(hue * 6 - 3) - 1);
        const cg = clamp01(2 - Math.abs(hue * 6 - 2));
        const cb = clamp01(2 - Math.abs(hue * 6 - 4));
        spheres.push(makeSphere(
          vec3(Math.sin(angle) * dist, r + y, Math.cos(angle) * dist),
          r, vec3(cr * 0.8 + 0.2, cg * 0.8 + 0.2, cb * 0.8 + 0.2), 0.35
        ));
      }
      lights = [
        { pos: vec3(4, 10, 4), color: vec3(1, 0.95, 0.9), intensity: 1.0 },
        { pos: vec3(-5, 7, -3), color: vec3(0.7, 0.8, 1.0), intensity: 0.6 },
      ];
    },
  ];
}

let currentSceneIdx = 0;
function setScene(idx) {
  currentSceneIdx = idx;
  document.querySelectorAll('#scene-controls button').forEach((b, i) => {
    if (i < 3) b.classList.toggle('active', i === idx);
  });
  needsRender = true;
}

function toggleReflections() {
  enableReflections = !enableReflections;
  document.getElementById('btn-reflections').textContent = 'Reflections: ' + (enableReflections ? 'ON' : 'OFF');
  document.getElementById('btn-reflections').classList.toggle('active', enableReflections);
  needsRender = true;
}

function toggleShadows() {
  enableShadows = !enableShadows;
  document.getElementById('btn-shadows').textContent = 'Shadows: ' + (enableShadows ? 'ON' : 'OFF');
  document.getElementById('btn-shadows').classList.toggle('active', enableShadows);
  needsRender = true;
}

// ============================================================
//  RAY-SPHERE INTERSECTION
// ============================================================
function intersectSphere(ray, sphere) {
  const oc = sub(ray.origin, sphere.center);
  const b = dot(oc, ray.dir);
  const c = dot(oc, oc) - sphere.radius * sphere.radius;
  const disc = b * b - c;
  if (disc < 0) return -1;
  const sqrtDisc = Math.sqrt(disc);
  let t = -b - sqrtDisc;
  if (t < 0.001) t = -b + sqrtDisc;
  if (t < 0.001) return -1;
  return t;
}

function intersectScene(ray) {
  let closest = Infinity;
  let hitSphere = null;
  for (let i = 0; i < spheres.length; i++) {
    const t = intersectSphere(ray, spheres[i]);
    if (t > 0 && t < closest) {
      closest = t;
      hitSphere = spheres[i];
    }
  }
  if (!hitSphere) return null;
  const point = add(ray.origin, mul(ray.dir, closest));
  const normal = norm(sub(point, hitSphere.center));
  return { t: closest, point, normal, sphere: hitSphere };
}

// ============================================================
//  SHADING
// ============================================================
let totalRays = 0;

function shade(ray, depth) {
  totalRays++;
  const hit = intersectScene(ray);
  if (!hit) {
    // Sky gradient
    const t = 0.5 * (ray.dir.y + 1);
    return lerp3(vec3(0.08, 0.08, 0.12), vec3(0.15, 0.15, 0.3), clamp01(t));
  }

  const { point, normal, sphere } = hit;

  // Emissive
  if (sphere.emissive.x > 0 || sphere.emissive.y > 0 || sphere.emissive.z > 0) {
    return sphere.emissive;
  }

  // Lighting
  let color = vec3(0, 0, 0);

  // Ambient
  const ambient = mul(sphere.color, 0.08);
  color = add(color, ambient);

  for (const light of lights) {
    const toLight = sub(light.pos, point);
    const lightDist = len(toLight);
    const lightDir = mul(toLight, 1 / lightDist);

    // Shadow check
    if (enableShadows) {
      const shadowRay = { origin: add(point, mul(normal, 0.002)), dir: lightDir };
      const shadowHit = intersectScene(shadowRay);
      totalRays++;
      if (shadowHit && shadowHit.t < lightDist) continue;
    }

    // Diffuse (Lambert)
    const diff = Math.max(0, dot(normal, lightDir));
    const attenuation = light.intensity / (1 + lightDist * 0.05);

    color = add(color, vec3(
      sphere.color.x * light.color.x * diff * attenuation,
      sphere.color.y * light.color.y * diff * attenuation,
      sphere.color.z * light.color.z * diff * attenuation
    ));

    // Specular (Blinn-Phong)
    const viewDir = norm(mul(ray.dir, -1));
    const halfVec = norm(add(lightDir, viewDir));
    const spec = Math.pow(Math.max(0, dot(normal, halfVec)), 64);
    const specColor = mul(light.color, spec * attenuation * 0.5);
    color = add(color, specColor);
  }

  // Reflections
  if (enableReflections && sphere.reflectivity > 0 && depth < MAX_BOUNCES) {
    const reflDir = reflect(ray.dir, normal);
    const reflRay = { origin: add(point, mul(normal, 0.002)), dir: reflDir };
    const reflColor = shade(reflRay, depth + 1);
    color = lerp3(color, reflColor, sphere.reflectivity);
  }

  // Checkerboard pattern on ground sphere (the big one)
  if (sphere.radius > 100) {
    const checker = (Math.floor(point.x) + Math.floor(point.z)) % 2;
    if (checker === 0) color = mul(color, 0.7);
  }

  return color;
}

// ============================================================
//  RENDER
// ============================================================
let needsRender = true;
let paused = false;
let time = 0;

function render() {
  const w = Math.floor(BASE_W * currentScale);
  const h = Math.floor(BASE_H * currentScale);

  if (canvas.width !== w || canvas.height !== h) {
    canvas.width = w;
    canvas.height = h;
  }

  const imgData = ctx.createImageData(w, h);
  const data = imgData.data;
  totalRays = 0;

  // Update scene
  scenePresets(time)[currentSceneIdx]();

  for (let py = 0; py < h; py++) {
    for (let px = 0; px < w; px++) {
      const u = (2 * px / w - 1) * (w / h);
      const v = 1 - 2 * py / h;
      const ray = getCameraRay(u, v);
      const col = shade(ray, 0);

      const idx = (py * w + px) * 4;
      // Tone mapping (simple Reinhard) + gamma
      data[idx]     = Math.floor(Math.pow(clamp01(col.x / (col.x + 1)), 0.45) * 255);
      data[idx + 1] = Math.floor(Math.pow(clamp01(col.y / (col.y + 1)), 0.45) * 255);
      data[idx + 2] = Math.floor(Math.pow(clamp01(col.z / (col.z + 1)), 0.45) * 255);
      data[idx + 3] = 255;
    }
  }

  ctx.putImageData(imgData, 0, 0);

  // Stats
  document.getElementById('rays').textContent = (totalRays / 1000).toFixed(0) + 'k';
  document.getElementById('sphere-count').textContent = spheres.length;
  document.getElementById('bounces').textContent = enableReflections ? MAX_BOUNCES : 0;
}

// ============================================================
//  INTERACTION
// ============================================================
let dragging = false;
let lastMouse = { x: 0, y: 0 };
let idleTimer = null;

canvas.addEventListener('mousedown', (e) => {
  dragging = true;
  lastMouse = { x: e.clientX, y: e.clientY };
  currentScale = scale;
  needsRender = true;
});

window.addEventListener('mousemove', (e) => {
  if (!dragging) return;
  const dx = e.clientX - lastMouse.x;
  const dy = e.clientY - lastMouse.y;
  camTheta -= dx * 0.008;
  camPhi = Math.max(-0.3, Math.min(1.4, camPhi + dy * 0.008));
  lastMouse = { x: e.clientX, y: e.clientY };
  needsRender = true;
});

window.addEventListener('mouseup', () => {
  if (dragging) {
    dragging = false;
    // Render at full quality after releasing
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => {
      currentScale = fullScale;
      needsRender = true;
    }, 100);
  }
});

canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  camDist = Math.max(4, Math.min(25, camDist + e.deltaY * 0.01));
  currentScale = scale;
  needsRender = true;
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => {
    currentScale = fullScale;
    needsRender = true;
  }, 200);
}, { passive: false });

// Touch support
canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  if (e.touches.length === 1) {
    dragging = true;
    lastMouse = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    currentScale = scale;
    needsRender = true;
  }
}, { passive: false });

canvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  if (!dragging || e.touches.length !== 1) return;
  const dx = e.touches[0].clientX - lastMouse.x;
  const dy = e.touches[0].clientY - lastMouse.y;
  camTheta -= dx * 0.008;
  camPhi = Math.max(-0.3, Math.min(1.4, camPhi + dy * 0.008));
  lastMouse = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  needsRender = true;
}, { passive: false });

canvas.addEventListener('touchend', () => {
  dragging = false;
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => {
    currentScale = fullScale;
    needsRender = true;
  }, 100);
});

window.addEventListener('keydown', (e) => {
  if (e.code === 'Space') {
    e.preventDefault();
    paused = !paused;
  }
});

// ============================================================
//  MAIN LOOP
// ============================================================
let lastTime = performance.now();
let frameCount = 0;
let fpsDisplay = 0;
let fpsTimer = 0;

function loop(now) {
  requestAnimationFrame(loop);

  const dt = (now - lastTime) / 1000;
  lastTime = now;

  if (!paused) {
    time += dt;
    needsRender = true;
  }

  fpsTimer += dt;
  frameCount++;
  if (fpsTimer >= 0.5) {
    fpsDisplay = Math.round(frameCount / fpsTimer);
    frameCount = 0;
    fpsTimer = 0;
  }

  if (needsRender) {
    render();
    needsRender = false;
    document.getElementById('fps').textContent = fpsDisplay;
  }
}

// Start
currentScale = fullScale;
requestAnimationFrame(loop);
</script>
</body>
</html>
